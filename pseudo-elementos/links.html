<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LInks</title>
<style>

    body{
        font-family: Arial, Helvetica, sans-serif;

    }
 
    a{
        color: red;
        text-decoration: none;
        font-weight: bold;
    }

    a:visited
    {
           color: green;
    }

    a:hover{
        color: black;
        text-decoration: underline;
    }
    a:active{
        color: yellow;
    } after{
         content:'[link] ';
         text-decoration: none;
         font-weight: normal;
         color: blue;
    }

    a::before{
        content: '✦ ';

    }
    a::after{
        content: '\21';
    }

     

</style>
</head>
<body>
    <h1>Personalizando links</h1>

    <ul>
        <li> <a href="https://gustavoguanabara.github.io" target="_blank">repositorio github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" target="_blank">site youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank">canal youtube</a></li>
    </ul>
    
    
</body>
</html>
